services:
  HomeBudgetAI-api:
    ports:
      - "8090:8090"
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
      target: builder
    init: true
    image: homebudgetai-api:latest
    command: /bin/sh -c "while sleep 1000; do :; done"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ..:/home/vscode/workspace:cached
      - ~/.ssh:/home/vscode/.ssh
      - gradle-cache:/home/vscode/.gradle
    working_dir: /home/vscode/workspace
  HomeBudgetAI-db:
    image: postgres:17
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: Asia/Tokyo
    volumes:
      - HomeBudgetAI-db-data:/var/lib/postgresql/data
      - ../data/db:/docker-entrypoint-initdb.d
volumes:
  gradle-cache:
  HomeBudgetAI-db-data:
