server:
  port: 8090
spring:
  application:
    name: HomeBudgetAI-api
  jpa:
    open-in-view: false
  messages:
    basename: messages-validation, messages

app:
  server:
    base-url: ${SERVER_BASE_URL:http://localhost:8090}
    cors-allowed-origin-patterns:
      - ${FRONTEND_ORIGIN:http://localhost:5173}
      - http://localhost:*
  db:
    url: ${JDBC_URL:jdbc:postgresql://HomeBudgetAI-db:5432/postgres}
    username: ${JDBC_USERNAME:postgres}
    password: ${JDBC_PASSWORD:password}
    jpa:
      package-to-scan:
        - api.context
        - api.model
      hibernate.ddl-auto: none
  batch:
    jobs:
      monthly-update:
        enabled: true
        cron: '0 0 0 1 * *'
        zone: Asia/Tokyo
  aws:
    region: ap-northeast-1
    bedrock:
      model-id: anthropic.claude-3-5-sonnet-20240620-v1:0
